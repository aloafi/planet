<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Planet turns your day into a sequence of tasks you execute one at a time." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/brand/planet-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Planet</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('planet:v1') || 'null')
        if (s && s.settings && s.settings.theme) document.documentElement.dataset.theme = s.settings.theme
        var l = s && s.settings && s.settings.lang
        if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl' }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
